{id:'T-01',title:'Alarm input',kind:'manual',criterion:'Valid future alarms save; invalid inputs explain the problem; only the selected alarm remains armed.',steps:['Save a named future alarm and verify it appears with the correct local date/time.','Try missing and invalid inputs; verify a useful error.','Try a past time; verify rejection.','Arm a second saved alarm; verify it replaces the previously armed selection.']},
{id:'T-02',title:'Hardware and readiness',kind:'manual',criterion:'Input/output interfaces are verified and missing prerequisites are explained; only a ready setup arms.',steps:['Verify the actual tap-module pin labels, idle/active polarity, voltage compatibility, and debounce behavior.','Verify the flash module enables its internal color cycle and switches off when disabled.','Try arming without a board connection, then with an unready input; check the errors.','Try blocked or unprepared browser audio; verify the error and sound-test action.','Complete the prerequisites and verify successful arming with the indicator off while waiting.']},

{id:'T-10',title:'Overnight readiness',kind:'manual',criterion:'The intended overnight configuration activates sound and flash and can be dismissed with a tap.',steps:['Leave host, browser, board, power, and network in the intended overnight configuration.','Observe the morning test: sound and flash activate.','Verify a tap completes the run and the outputs stop.','Check the outcome log and resolve any sleep, power, audio, or connection failure before prototype study mornings.']}
];

if(def.kind==='tap'){complete=done===20;meets=complete&&good>=19;summary=`${done}/20 recorded · ${good}/20 accepted within 1 s`;}

function studyView(){const m=state.mornings[morningIndex];if(!m.method)m.method=state.meta.method;if(!m.build)m.build=state.meta.build;const base=`mornings.${morningIndex}`,started=state.mornings.some(C.hasObservation),assigned=state.mornings.filter(x=>['A','B'].includes(x.condition)).length;return `<div class="eyebrow">03 / Actual morning comparison</div><h1>Record twelve real mornings.</h1><p class="lede">A = usual bedside alarm. B = WakeQuest across the room. Plan six two-morning blocks, choosing AB or BA randomly within each block. Keep schedule, audibility, placement, and observation method comparable.</p>${stats()}<div class="notice ${state.tests['T-10'].status==='passed'?'':'warn'}"><strong>${state.tests['T-10'].status==='passed'?'Overnight readiness signed off.':'Before prototype mornings: complete T-10 overnight readiness.'}</strong> A technical failure is still an outcome to record.</div><div class="study-controls"><button class="btn primary" data-action="generate-order" ${started?'disabled':''}>Generate 6 randomized AB / BA pairs</button>${input('plan.startDate','First morning date','date')}<button class="btn" data-action="fill-dates">Fill unobserved morning dates</button><span class="small">${assigned}/12 conditions assigned · ${E(state.plan.method||'order not planned')}${started?' · randomization locked after observations start':''}</span></div><div class="study-layout"><article class="panel morning-list" style="padding:0;overflow:hidden"><div style="padding:17px 16px;border-bottom:1px solid var(--line)"><h2 style="margin:0 0 4px;font-size:17px">Morning records</h2><span class="small">Select a morning to record its outcome.</span></div>${state.mornings.map((x,i)=>`<button class="morning-row" data-morning="${i}" aria-pressed="${i===morningIndex}"><span class="id">M${String(i+1).padStart(2,'0')}</span><span>${E(x.date||'Date not set')}<small>Block ${x.block} · ${E(rowMorningLabel(x))}</small></span><span class="badge">${x.condition==='A'?'A · usual':x.condition==='B'?'B · device':'—'}</span><span class="measure">${x.outcome==='stood'&&C.standingTime(x)!==null?C.standingTime(x).toFixed(1)+' s':x.outcome==='not_up'?'>300 s':'—'}</span></button>`).join('')}</article><article class="panel morning-editor"><div class="kicker">M${String(morningIndex+1).padStart(2,'0')} / BLOCK ${m.block}</div><h2>Observe the morning.</h2><div class="field-grid">${input(`${base}.date`,'Date','date')}${select(`${base}.condition`,'Condition',[['','Choose…'],['A','A · usual bedside alarm'],['B','B · WakeQuest']])}${input(`${base}.participant`,'Participant code')}${input(`${base}.build`,'Prototype build / version (condition B)')}${select(`${base}.method`,'Actual observation method',methods)}${select(`${base}.outcome`,'Observed outcome',[['','Not recorded'],['stood','Stood within 5 minutes'],['not_up','Not up within 5 minutes'],['alarm_failed','Alarm failed to sound'],['aborted','Run aborted']])}</div><div class="mode-fields">${select(`${base}.mode`,'How is time recorded?',[['seconds','Observed elapsed seconds'],['timestamps','Observation timestamps']])}<div id="secondsFields" class="field-grid section-gap" ${m.mode==='timestamps'?'hidden':''}>${input(`${base}.standSeconds`,'Alarm onset → actual full stand (s)','number','min="0" max="300" step="0.1"')}${input(`${base}.tapSeconds`,'Alarm onset → accepted tap (s), optional','number','min="0" step="0.001"')}</div><div id="timestampFields" ${m.mode==='timestamps'?'':'hidden'}><div class="field-grid section-gap">${input(`${base}.onsetAt`,'Actual audible alarm onset','datetime-local','step="0.001"')}${input(`${base}.standAt`,'Observed first full stand','datetime-local','step="0.001"')}${input(`${base}.tapAt`,'Accepted tap receipt, optional','datetime-local','step="0.001"')}</div><div class="inline-buttons"><button class="btn" data-action="mark-onset">Mark audible onset now</button><button class="btn" data-action="mark-stand">Mark full stand now</button><button class="btn" data-action="mark-tap">Mark accepted tap now</button></div></div><div class="summary-band" id="morningTiming"></div><p class="small">Full stand means upright with both feet supporting body weight. For “not up within 5 minutes,” record a censored outcome; do not enter 300 as an exact standing time. Timestamps use ${E(timezone)}.</p></div><div class="field-grid section-gap">${select(`${base}.returned`,'Returned to bed within 10 min after standing?',yn)}${input(`${base}.sleepHours`,'Estimated sleep hours, optional','number','min="0" max="24" step="0.1"')}${input(`${base}.motivation`,'Motivation after use (1–5), condition B','number','min="1" max="5" step="1"')}${input(`${base}.annoyance`,'Annoyance after use (1–5), condition B','number','min="1" max="5" step="1"')}${input(`${base}.evidence`,'Observation / recording / log reference')}${textarea(`${base}.context`,'Sleep/context notes, failure/abort reason, or method details','wide')}</div><div class="finalize-row"><button class="btn primary" data-action="commit-morning">Sign off this morning</button><span class="small" id="morningSigned">${m.finalizedAt?'Signed '+E(new Date(m.finalizedAt).toLocaleString()):'Draft · not signed off'}</span></div><div class="validation" id="morningValidation" role="status"></div>${m.history.length?`<p class="small section-gap">${m.history.length} earlier sign-off${m.history.length===1?'':'s'} retained in the JSON backup.</p>`:''}</article></div>`;}
const HINFO={H1:['Faster bed exit','Target: at least 30% lower median time to stand with WakeQuest.'],H2:['Remaining up','Target: at least 5 of the 6 planned prototype mornings include a stand and no return to bed within 10 minutes.'],H3:['Reliable interaction','Target: at least 19/20 deliberate taps accepted within 1 second, no duplicate completion, and nuisance dismissals documented.'],H4:['Understandable flow','Target: at least 4/5 first-time testers complete setup and use unaided within 120 seconds.'],H5:['Appealing reward','Target: median motivation ≥4/5 and annoyance ≤2/5 after prototype mornings.']};
function summaryView(){const a=C.analyze(state),fmt=(n)=>n===null?'Not estimable':n.toFixed(1)+' s';return `<div class="eyebrow">04 / Evidence and decisions</div><h1>Evaluate the evidence.<br>Choose the next change.</h1><p class="lede">Calculated targets are provisional until the required observations and sign-offs exist. Record your interpretation separately; a met target is not proof of a general behavioral effect.</p>${stats()}<article class="panel"><h2>Morning comparison at a glance</h2><div class="table-wrap"><table class="median-table"><thead><tr><th>Condition</th><th>Signed outcomes</th><th>Primary observations</th><th>Median time to stand</th><th>Not up in 5 min</th><th>Alarm failures / aborts</th></tr></thead><tbody><tr><td>A · usual</td><td>${a.A.length}/6</td><td>${a.a.n}</td><td>${fmt(a.a.value)}</td><td>${a.a.censored}</td><td>${a.a.failures} / ${a.a.aborts}</td></tr><tr><td>B · WakeQuest</td><td>${a.B.length}/6</td><td>${a.b.n}</td><td>${fmt(a.b.value)}</td><td>${a.b.censored}</td><td>${a.b.failures} / ${a.b.aborts}</td></tr></tbody></table></div><p class="small section-gap">Medians include “not up within 5 min” as right-censored observations rather than dropping them or treating them as exact 300-second events. If a middle value is censored, the median is not reported as an exact number. Unmeasured failures/aborts and incomplete or non-comparable data prevent an automatic H1 verdict.</p></article><div class="hypothesis-grid section-gap">${Object.keys(HINFO).map(id=>{const h=a[id];return `<article class="hypothesis"><div class="hypothesis-heading"><h2>${id} · ${HINFO[id][0]}</h2>${badge(h.status)}</div><p class="criterion">${E(HINFO[id][1])}</p><div class="calculation">${E(h.summary)}</div>${h.reasons.length?`<ul class="reasons">${h.reasons.map(r=>`<li>${E(r)}</li>`).join('')}</ul>`:''}${id==='H5'?`<p class="small">Separate classroom sample: n=${h.classroom.n}; motivation ${h.classroom.motivation===null?'—':h.classroom.motivation.toFixed(1)}/5; annoyance ${h.classroom.annoyance===null?'—':h.classroom.annoyance.toFixed(1)}/5. These ratings are not pooled with morning data.</p>`:''}<div class="field-grid">${select(`decisions.${id}.verdict`,'Your interpretation',[['','Not decided'],['supported','Supported for this study'],['not_supported','Not supported'],['inconclusive','Inconclusive / improve the test']])}${textarea(`decisions.${id}.notes`,'Reason, evidence, and limitations')}</div></article>`;}).join('')}</div><article class="panel section-gap"><div class="kicker">NEXT ITERATION</div><div class="field-grid">${select('conclusion.next','Overall next step',[['','Choose…'],['continue','Continue to the next assumption'],['change','Change the prototype / solution'],['retest','Improve the test and repeat']])}${input('conclusion.change','Most important change for the next backlog')}${textarea('conclusion.notes','We changed ___ because ___ / remaining questions','wide')}</div></article>`;}
function render(){document.querySelectorAll('[data-route]').forEach(b=>b.dataset.route===route?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));$('content').innerHTML=route==='setup'?setupView():route==='tests'?testsView():route==='study'?studyView():summaryView();updateComputed();}
function changeRoute(next){route=['setup','tests','study','summary'].includes(next)?next:'setup';document.body.classList.remove('menu-open');$('menuButton').setAttribute('aria-expanded','false');history.replaceState(null,'','#'+route);render();window.scrollTo({top:0,behavior:'instant'});}

function validation(id,errors){const el=$(id);if(el)el.innerHTML=errors.length?`<div class="notice error"><ul>${errors.map(x=>`<li>${E(x)}</li>`).join('')}</ul></div>`:'';}
function commitTest(){const t=state.tests[testId],d=C.TESTS.find(x=>x.id===testId),e=C.evaluateTest(state,testId),errors=[];if(!state.meta.tester.trim())errors.push('Record the tester/facilitator in Session & readiness.');if(!t.build.trim())errors.push('Record the build/version for this attempt.');if(t.proposedStatus==='passed'&&!e.allowsPass)errors.push('The checklist or required measurements do not meet this test’s acceptance criterion.');if(['failed','blocked'].includes(t.proposedStatus)&&!t.observations.trim())errors.push('Explain the failure or block in actual observations.');if(t.proposedStatus==='passed'&&d.kind==='manual'&&!t.observations.trim())errors.push('Describe the actual observed result before signing off.');if(errors.length){validation('testValidation',errors);return;}if(['passed','failed','blocked'].includes(t.status)&&t.status!==t.proposedStatus)archive(t);t.status=t.proposedStatus;t.startedAt=t.startedAt||new Date().toISOString();t.finalizedAt=t.status==='in_progress'?'':new Date().toISOString();save();render();toast('Test verdict recorded.');}
function commitMorning(){const m=state.mornings[morningIndex],errors=C.morningErrors(m);if(state.mornings.some((x,i)=>i!==morningIndex&&x.date&&x.date===m.date))errors.push('Another morning uses this date; confirm that these are distinct study mornings.');if(!state.meta.tester.trim())errors.push('Record the tester/facilitator in Session & readiness.');if(errors.length){validation('morningValidation',errors);return;}m.finalizedAt=new Date().toISOString();save();render();toast('Morning record signed off.');}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Export prepared: '+name);}
function fileStem(){return 'wakequest-test-results-'+new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);}
function mdCell(v){return String(v??'').replace(/\|/g,'\\|').replace(/\r?\n/g,'<br>');}
function mdTable(headers,rows){return '| '+headers.map(mdCell).join(' | ')+' |\n| '+headers.map(()=>'---').join(' | ')+' |\n'+rows.map(r=>'| '+r.map(mdCell).join(' | ')+' |').join('\n')+'\n';}
function markdownReport(){const a=C.analyze(state);let s=`# ${state.meta.title}\n\nExported: ${new Date().toISOString()}\nProtocol ID: ${state.id}\n\n`+Object.entries(state.meta).map(([k,v])=>`- ${k}: ${v||'Not recorded'}`).join('\n')+'\n\n## Readiness\n\n'+C.PREFLIGHT.map(([k,t])=>`- [${state.preflight[k]?'x':' '}] ${t}`).join('\n')+'\n\n## Functional and classroom tests\n\n';for(const d of C.TESTS){const t=state.tests[d.id];s+=`### ${d.id} — ${d.title}\n\n- Criterion: ${d.criterion}\n- Build: ${t.build||'Not recorded'}\n- Verdict: ${statuses[t.status]}\n- Signed: ${t.finalizedAt||'Not signed off'}\n- Calculated record: ${C.evaluateTest(state,d.id).summary}\n- Evidence: ${t.evidence||'Not recorded'}\n\n`+d.steps.map((x,i)=>`- [${t.checks[i]?'x':' '}] ${x}`).join('\n')+`\n\nActual observations:\n\n${t.observations||'Not recorded'}\n\n`;if(d.kind==='disconnect')s+=`Disconnect detection: ${t.disconnectSeconds===''?'Not recorded':t.disconnectSeconds} seconds\n\n`;if(t.rows.length){const keys=Object.keys(t.rows[0]);s+=mdTable(['Trial',...keys],t.rows.map((r,i)=>[i+1,...keys.map(k=>r[k])]))+'\n';}if(t.history.length){s+='Previous attempts (retained):\n\n';t.history.forEach((h,i)=>{s+=`#### Previous attempt ${i+1}\n\n- Build: ${h.build||'Not recorded'}\n- Verdict: ${statuses[h.status]}\n- Signed: ${h.finalizedAt||'Not signed off'}\n- Observations: ${h.observations||'Not recorded'}\n\n`;if(h.rows.length){const keys=Object.keys(h.rows[0]);s+=mdTable(['Trial',...keys],h.rows.map((r,j)=>[j+1,...keys.map(k=>r[k])]))+'\n';}});}}
s+='## Morning comparison\n\n'+`Order method: ${state.plan.method||'Not planned'}; generated: ${state.plan.generatedAt||'Not generated'}.\n\n`+mdTable(['Morning','Date','Participant','Condition','Build','Method','Outcome','Standing time (s)','Tap response (s)','Return within 10 min','Motivation','Annoyance','Signed','Notes'],state.mornings.map((m,i)=>[i+1,m.date,m.participant,m.condition,m.build,m.method,m.outcome||'Not recorded',m.outcome==='not_up'?'>300 (censored)':C.standingTime(m)??'',C.tapTime(m)??'',m.returned,m.motivation,m.annoyance,m.finalizedAt,m.context]))+'\n';
for(const id of Object.keys(HINFO)){const h=a[id];s+=`## ${id} — ${HINFO[id][0]}\n\n- Criterion: ${HINFO[id][1]}\n- Calculated target: ${statuses[h.status]}\n- Calculation: ${h.summary}\n`+h.reasons.map(x=>'- Interpretation note: '+x+'\n').join('')+`- Tester interpretation: ${state.decisions[id].verdict||'Not decided'}\n\n${state.decisions[id].notes||'No interpretation notes.'}\n\n`;if(id==='H5')s+=`Separate classroom ratings: n=${h.classroom.n}; motivation=${h.classroom.motivation??'not recorded'}; annoyance=${h.classroom.annoyance??'not recorded'}.\n\n`;}
s+=`## Next iteration\n\n- Decision: ${state.conclusion.next||'Not decided'}\n- Change: ${state.conclusion.change||'Not recorded'}\n\n${state.conclusion.notes||'No notes.'}\n`;return s;}
function morningCSV(){const keys=['id','block','date','condition','participant','build','method','outcome','mode','onsetAt','standAt','tapAt','returned','motivation','annoyance','sleepHours','context','evidence','finalizedAt'];const cell=v=>{let t=String(v??'');if(/^[=+@\t\r-]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';};const headers=[...keys,'observed_time_to_stand_seconds','tap_response_seconds'];return [headers.map(cell).join(','),...state.mornings.map(m=>[...keys.map(k=>m[k]),m.outcome==='not_up'?'>300 (censored)':C.standingTime(m)??'',C.tapTime(m)??''].map(cell).join(','))].join('\r\n');}
function reportTable(headers,rows){return `<table><thead><tr>${headers.map(x=>`<th>${E(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${E(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
function printReport(){const a=C.analyze(state);let html=`<h1>${E(state.meta.title)}</h1><p>Exported ${E(new Date().toLocaleString())} · Tester ${E(state.meta.tester||'Not recorded')} · Build ${E(state.meta.build||'Not recorded')}</p>`+reportTable(['Hypothesis','Proposed criterion','Calculated target','Observation / interpretation'],Object.keys(HINFO).map(id=>[id,HINFO[id][1],statuses[a[id].status],a[id].summary+'\n'+(state.decisions[id].notes||'No tester interpretation.')]))+'<h2>Functional and classroom test record</h2>';for(const d of C.TESTS){const t=state.tests[d.id];html+=`<article><h3>${d.id} · ${E(d.title)} — ${E(statuses[t.status])}</h3><p>${E(d.criterion)}</p><small>Build ${E(t.build||'not recorded')} · Signed ${E(t.finalizedAt||'not signed off')} · Evidence ${E(t.evidence||'not recorded')}</small><p>${E(C.evaluateTest(state,d.id).summary)}</p><p>${E(t.observations||'No observations recorded.')}</p>`;if(t.rows.length){const keys=Object.keys(t.rows[0]);html+=reportTable(['#',...keys],t.rows.map((r,i)=>[i+1,...keys.map(k=>r[k])])).replace('<table>','<table>');}if(t.history.length)html+=`<small>${t.history.length} prior attempts preserved in JSON and Markdown exports.</small>`;html+='</article>';}
html+='<div class="report-section"><h2>Morning comparison</h2>'+reportTable(['Morning / date / condition','Outcome / standing time','Tap response','Return / ratings','Method / build','Notes'],state.mornings.map(m=>[`M${m.id} · ${m.date||'undated'} · ${m.condition||'unassigned'}`,`${m.outcome||'Not recorded'} · ${m.outcome==='not_up'?'>300 s (censored)':C.standingTime(m)===null?'—':C.standingTime(m)+' s'}`,C.tapTime(m)===null?'—':C.tapTime(m)+' s',`${m.returned||'—'} · motivation ${m.motivation||'—'}/5 · annoyance ${m.annoyance||'—'}/5`,`${m.method||'—'} · ${m.build||'—'}`,m.context]))+`<h2>Next iteration</h2><p>${E(state.conclusion.next||'Not decided')} · ${E(state.conclusion.change)}</p><p>${E(state.conclusion.notes)}</p></div>`;$('printReport').innerHTML=html;window.print();}
function generateOrder(){if(state.mornings.some(C.hasObservation)){toast('Order generation is locked after observations start.');return;}for(let b=0;b<6;b++){const order=Math.random()<.5?['A','B']:['B','A'];for(let j=0;j<2;j++)state.mornings[b*2+j].condition=order[j];}state.plan.method='randomized AB/BA pairs';state.plan.generatedAt=new Date().toISOString();save();render();}

function mark(which){const m=state.mornings[morningIndex],base=`mornings.${morningIndex}`;setField(base+'.mode','timestamps');if(which==='onset')setField(base+'.onsetAt',localStamp());if(which==='stand'){setField(base+'.standAt',localStamp());setField(base+'.outcome','stood');}if(which==='tap')setField(base+'.tapAt',localStamp());render();}
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset.bind)return;setField(el.dataset.bind,el.type==='checkbox'?el.checked:el.value);});document.addEventListener('change',e=>{const el=e.target;if(el.id==='testSelect'){testId=el.value;render();}if(el.tagName==='SELECT'&&el.dataset.bind){setField(el.dataset.bind,el.value);if(el.dataset.bind.endsWith('.condition')||el.dataset.bind.endsWith('.mode')){const path=el.dataset.bind;render();const again=document.querySelector(`[data-bind="${path}"]`);again?.focus();}}});
document.addEventListener('focusin',e=>{if(e.target.dataset?.bind&&e.target.type==='number'&&!/motivation|annoyance|sleepHours/.test(e.target.dataset.bind))lastMetric=e.target.dataset.bind;});
document.addEventListener('click',async e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.route){changeRoute(target.dataset.route);return;}if(target.dataset.test){testId=target.dataset.test;render();return;}if(target.dataset.morning!==undefined){morningIndex=Number(target.dataset.morning);const m=state.mornings[morningIndex];if(!m.method)m.method=state.meta.method;if(!m.build)m.build=state.meta.build;render();return;}const a=target.dataset.action;if(!a)return;if(a==='commit-test')commitTest();else if(a==='commit-morning')commitMorning();else if(a==='generate-order')generateOrder();else if(a==='fill-dates')fillDates();else if(a==='previous-test'||a==='next-test'){const i=C.TESTS.findIndex(d=>d.id===testId);testId=C.TESTS[(i+(a==='next-test'?1:9))%10].id;render();}else if(a==='repeat-test'){const t=state.tests[testId];if(!await askConfirm('Start a fresh attempt? The current attempt will be retained in history.','Start new attempt'))return;archive(t);const fresh=C.freshTest(C.TESTS.find(d=>d.id===testId),state.meta.build);fresh.history=t.history;state.tests[testId]=fresh;save();render();}else if(a==='add-rehearsal'){const t=state.tests['T-09'];if(t.rows.length>=100){toast('Export this record and start a new attempt for more trials.');return;}if(['passed','failed','blocked'].includes(t.status)){archive(t);t.status='in_progress';t.finalizedAt='';}t.rows.push({completed:'',reset:'',note:''});save();render();}else if(a.startsWith('mark-'))mark(a.slice(5));else if(a==='timer-start'){if(!state.timer.running){state.timer.running=true;state.timer.startedAt=Date.now();save();}}else if(a==='timer-stop'){if(state.timer.running){state.timer.elapsed=timerValue()*1000;state.timer.running=false;state.timer.startedAt=0;save();}}else if(a==='timer-lap'){state.timer.laps.push(timerValue());save();if($('timerLaps'))$('timerLaps').textContent='Laps: '+state.timer.laps.map(x=>x.toFixed(1)+' s').join(' · ');}else if(a==='timer-reset'){state.timer={running:false,elapsed:0,startedAt:0,laps:[]};save();render();}else if(a==='timer-apply'){if(!lastMetric||!document.querySelector(`[data-bind="${lastMetric}"]`)){toast('Select a seconds field on the current test first.');return;}if(state.timer.running){toast('Stop the timer before applying its value.');return;}const v=timerValue().toFixed(1);setField(lastMetric,v);document.querySelector(`[data-bind="${lastMetric}"]`).value=v;toast('Applied '+v+' seconds to the selected field.');}});
$('menuButton').addEventListener('click',()=>{const open=document.body.classList.toggle('menu-open');$('menuButton').setAttribute('aria-expanded',String(open));});$('closeMenu').addEventListener('click',()=>{document.body.classList.remove('menu-open');$('menuButton').setAttribute('aria-expanded','false');});$('exportJSON').addEventListener('click',()=>download(fileStem()+'.json',JSON.stringify(state,null,2),'application/json'));$('exportMD').addEventListener('click',()=>download(fileStem()+'.md',markdownReport(),'text/markdown;charset=utf-8'));$('exportCSV').addEventListener('click',()=>download(fileStem()+'-mornings.csv',morningCSV(),'text/csv;charset=utf-8'));$('printButton').addEventListener('click',printReport);$('importJSON').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('Backup exceeds the 5 MB import limit.');const restored=C.hydrate(JSON.parse(await file.text()));if(!await askConfirm('Replace the current browser record with this backup? Export the current record first if you need it.','Replace record'))return;state=restored;lastMetric='';save();render();toast('Backup imported.');}catch(error){toast('Import failed: '+error.message);}finally{e.target.value='';}});window.addEventListener('hashchange',()=>{route=['setup','tests','study','summary'].includes(location.hash.slice(1))?location.hash.slice(1):'setup';render();});setInterval(()=>{if($('timerValue'))$('timerValue').textContent=timerValue().toFixed(1)+' s';},100);route=['setup','tests','study','summary'].includes(location.hash.slice(1))?location.hash.slice(1):'setup';render();if(storageOK&&state.savedAt){$('saveState').textContent='Restored saved protocol';$('saveDetail').textContent='Last saved '+new Date(state.savedAt).toLocaleString()+'. Export JSON for a portable backup.';}else if(!storageOK){$('saveState').textContent='Local storage unavailable';$('saveDetail').textContent='Export JSON before closing; entries are in memory only.';}
</script></body></html>
