[project]
name = "wakequest"
version = "0.1.0"
description = "WakeQuest local service: alarm scheduling, session state machine and ESP32 device link"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
